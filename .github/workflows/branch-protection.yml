name: Configure Branch Protection

# This workflow applies branch protection rules to the main branch.
# It runs automatically when merged to main, and can also be triggered manually.
#
# IMPORTANT: For this workflow to succeed, GitHub Actions must be allowed to
# administer the repository. Go to:
#   Settings → Actions → General → Workflow permissions
# and select "Read and write permissions", then also check
# "Allow GitHub Actions to create and approve pull requests".
# If the GITHUB_TOKEN still lacks admin rights, create a Personal Access Token
# (PAT) with the `repo` scope, store it as a repository secret named
# `REPO_ADMIN_TOKEN`, and replace `secrets.GITHUB_TOKEN` below with
# `secrets.REPO_ADMIN_TOKEN`.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-protection.yml'

jobs:
  protect-main:
    name: Apply main branch protection rules
    runs-on: ubuntu-latest
    permissions:
      # `administration: write` is required to update branch protection rules.
      # This permission must also be enabled in the repository's Actions settings.
      administration: write

    steps:
      - name: Apply branch protection to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              // Require the CI workflow's "test" job to pass before merging.
              // GitHub Actions check names use the format "<workflow name> / <job name>".
              required_status_checks: {
                strict: false,
                contexts: ['CI / test']
              },
              enforce_admins: false,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                required_approving_review_count: 1
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false,
              block_creations: false,
              required_conversation_resolution: true
            });
            console.log('Branch protection rules applied to main successfully.');
